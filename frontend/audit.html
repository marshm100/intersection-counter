<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event Audit</title>
<style>
  :root { --bg:#111827; --panel:#1f2937; --line:#374151; --ink:#e5e7eb; --muted:#9ca3af;
          --ok:#10b981; --bad:#f43f5e; --gate:#e879f9; --accent:#60a5fa; --track:#facc15; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink);
         display: flex; height: 100vh; overflow: hidden; font-size: 13px; }
  #side { width: 330px; padding: 14px; background: var(--panel); overflow-y: auto; flex-shrink: 0;
          display: flex; flex-direction: column; gap: 12px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
           background: #000; min-height: 0; }
  #wrap { position: relative; }
  video, canvas { display: block; }
  canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
  h1 { font-size: 16px; margin: 0; }
  h2 { font-size: 12px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  select, button, input { font: inherit; color: var(--ink); background: #111827; border: 1px solid var(--line);
                          border-radius: 5px; padding: 6px 9px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .claim { padding: 10px; border-radius: 6px; background: #111827; border: 1px solid var(--track); line-height: 1.5; }
  .claim .mv { font-size: 16px; font-weight: 600; color: #fff; }
  .verdicts { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .verdicts button { text-align: left; padding: 8px 10px; display: flex; justify-content: space-between; }
  .verdicts button kbd { color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .verdicts button[aria-pressed="true"] { outline: 2px solid var(--accent); border-color: var(--accent); }
  #v-correct { border-color: #065f46; } #v-wrong_movement, #v-not_intersection, #v-double { border-color: #7f1d1d; }
  .field { display: grid; grid-template-columns: 76px 1fr; gap: 6px; align-items: center; margin-top: 6px; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px;
         background: var(--panel); border-top: 1px solid var(--line); }
  #clock { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; min-width: 14ch; }
  #scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress div { height: 100%; background: var(--ok); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .keys { font-size: 12px; color: var(--muted); line-height: 1.8; }
  .keys b { color: var(--ink); font-family: ui-monospace, Consolas, monospace; background: var(--line);
            padding: 0 5px; border-radius: 3px; }
  .muted { color: var(--muted); }
  #toast { position: absolute; top: 10px; right: 10px; background: #065f46; color: #fff;
           padding: 6px 12px; border-radius: 5px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.err { background: #7f1d1d; }
</style>
</head>
<body>
<div id="side">
  <div>
    <h1>Event audit</h1>
    <div class="muted">Each clip is one vehicle the software COUNTED (yellow box and path).
      Say whether the count is right.</div>
  </div>
  <div>
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Progress</h2>
      <span id="prog" class="muted"></span></div>
    <div class="progress"><div id="progBar" style="width:0"></div></div>
  </div>
  <div class="claim" aria-live="polite">
    <div class="muted" id="where"></div>
    <div>The software counted: <span class="mv" id="claim"></span></div>
    <div class="muted" id="detail"></div>
  </div>
  <div>
    <h2>Your verdict</h2>
    <div class="verdicts">
      <button id="v-correct" type="button" data-v="correct">Correct — that vehicle made that movement <kbd>1</kbd></button>
      <button id="v-wrong_movement" type="button" data-v="wrong_movement">Real vehicle, wrong movement <kbd>2</kbd></button>
      <button id="v-not_intersection" type="button" data-v="not_intersection">Not a vehicle going through the intersection <kbd>3</kbd></button>
      <button id="v-double" type="button" data-v="double">Real, but already counted (a second piece) <kbd>4</kbd></button>
      <button id="v-unsure" type="button" data-v="unsure">Can't tell <kbd>5</kbd></button>
    </div>
    <div id="wrongBox" hidden>
      <div class="field"><label for="trueO">Came from</label><select id="trueO"></select></div>
      <div class="field"><label for="trueD">Went to</label><select id="trueD"></select></div>
      <div class="row" style="margin-top:8px"><button id="saveWrong" type="button">Save (Enter)</button></div>
    </div>
    <div class="field"><label for="note">Note</label><input id="note" placeholder="optional"></div>
  </div>
  <div class="row">
    <button id="prevBtn" type="button">&larr; Previous</button>
    <button id="nextBtn" type="button">Next &rarr;</button>
    <button id="todoBtn" type="button">Next unanswered</button>
  </div>
  <div class="keys">
    <b>Space</b> play / pause &nbsp; <b>R</b> replay<br>
    <b>&larr;</b><b>&rarr;</b> 1 second &nbsp; <b>[</b> <b>]</b> previous / next item<br>
    <b>1</b>-<b>5</b> verdict (moves to the next item)
  </div>
</div>

<div id="main">
  <div id="stage">
    <div id="wrap">
      <video id="vid" preload="auto" muted playsinline></video>
      <canvas id="cv"></canvas>
    </div>
    <div id="toast" role="status"></div>
  </div>
  <div id="bar">
    <button id="playBtn" type="button">Play</button>
    <button id="replayBtn" type="button">Replay</button>
    <select id="speed" aria-label="Playback speed">
      <option value="0.5">&frac12;&times;</option>
      <option value="1" selected>1&times;</option>
      <option value="2">2&times;</option>
      <option value="4">4&times;</option>
    </select>
    <input id="scrub" type="range" min="0" max="10" step="0.1" value="0" aria-label="Clip position">
    <span id="clock"></span>
  </div>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  let pid = params.get('pid');
  const batch = params.get('batch') || 'a1';
  const vid = document.getElementById('vid'), cv = document.getElementById('cv');
  const ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let items = [], idx = 0, item = null, legs = [], legsCam = null, curVideo = null;

  function toast(msg, err) {
    const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : '';
    t.style.opacity = 1; clearTimeout(toast._h); toast._h = setTimeout(() => t.style.opacity = 0, 1500);
  }
  async function api(path, opts) {
    const r = await fetch(path, opts);
    if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {} throw new Error(d); }
    return r.json();
  }
  const fps = () => item ? item.fps : 10;
  const t0 = () => item ? item.start_frame / item.fps : 0;
  const t1 = () => item ? item.end_frame / item.fps : 0;
  const fmt = s => { s = Math.max(0, s); return s.toFixed(1) + ' s'; };
  const legById = id => legs.find(l => l.leg_id === id);
  const legName = l => {
    if (!l) return 'unknown';
    const name = l.label || ('leg ' + l.leg_id), card = l.cardinal_direction;
    return card && card !== name ? `${name} (${card})` : name;
  };

  function layout() {
    if (!vid.videoWidth) return;
    const k = Math.min(stage.clientWidth / vid.videoWidth, stage.clientHeight / vid.videoHeight);
    const w = Math.floor(vid.videoWidth * k), h = Math.floor(vid.videoHeight * k);
    vid.style.width = cv.style.width = w + 'px'; vid.style.height = cv.style.height = h + 'px';
    cv.width = vid.videoWidth; cv.height = vid.videoHeight;
  }
  window.addEventListener('resize', layout);

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!item) return;
    const s = cv.width / 640;
    for (const lg of legs) {
      if (!lg.gate_segment || lg.gate_segment.length !== 2) continue;
      ctx.strokeStyle = 'rgba(232,121,249,0.85)'; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.moveTo(...lg.gate_segment[0]); ctx.lineTo(...lg.gate_segment[1]); ctx.stroke();
      const mx = (lg.gate_segment[0][0] + lg.gate_segment[1][0]) / 2, my = (lg.gate_segment[0][1] + lg.gate_segment[1][1]) / 2;
      const txt = legName(lg); ctx.font = `bold ${12 * s}px system-ui`; const tw = ctx.measureText(txt).width;
      ctx.fillStyle = 'rgba(17,24,39,0.8)'; ctx.fillRect(mx - tw / 2 - 4, my - 10 * s, tw + 8, 17 * s);
      ctx.fillStyle = '#f9fafb'; ctx.fillText(txt, mx - tw / 2, my + 3 * s);
    }
    const tr = item.track; if (!tr.length) return;
    const f = vid.currentTime * fps();
    // the whole path, faint; the part already driven, solid
    ctx.lineWidth = 2 * s;
    ctx.strokeStyle = 'rgba(250,204,21,0.35)'; ctx.beginPath();
    tr.forEach((p, i) => { const y = p[2] + p[4] / 2; i ? ctx.lineTo(p[1], y) : ctx.moveTo(p[1], y); }); ctx.stroke();
    ctx.strokeStyle = 'rgba(250,204,21,0.95)'; ctx.beginPath(); let started = false;
    for (const p of tr) { if (p[0] > f) break; const y = p[2] + p[4] / 2; started ? ctx.lineTo(p[1], y) : ctx.moveTo(p[1], y); started = true; }
    ctx.stroke();
    // the box nearest the current frame, while the track is alive
    let best = null, bd = Infinity;
    for (const p of tr) { const d = Math.abs(p[0] - f); if (d < bd) { bd = d; best = p; } }
    if (best && bd <= 1.5 * fps()) {
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.5 * s;
      ctx.strokeRect(best[1] - best[3] / 2, best[2] - best[4] / 2, best[3], best[4]);
    }
  }
  function tick() {
    if (item) {
      if (vid.currentTime > t1()) { vid.currentTime = t0(); }
      const rel = vid.currentTime - t0();
      $('clock').textContent = `${fmt(rel)} / ${fmt(t1() - t0())}`;
      if (document.activeElement !== $('scrub')) $('scrub').value = rel.toFixed(1);
      $('playBtn').textContent = vid.paused ? 'Play' : 'Pause';
      draw();
    }
    requestAnimationFrame(tick);
  }

  function renderProgress() {
    const done = items.filter(i => i.answer).length;
    $('prog').textContent = `${done} of ${items.length} done`;
    $('progBar').style.width = (items.length ? 100 * done / items.length : 0) + '%';
  }
  function fillLegs(sel, chosen) {
    sel.innerHTML = legs.map(l => `<option value="${l.leg_id}">${esc(legName(l))}</option>`).join('');
    if (chosen != null) sel.value = String(chosen);
  }
  async function load(i) {
    if (!items.length) return;
    idx = (i + items.length) % items.length;
    item = await api(`/api/projects/${pid}/audit-items/${items[idx].item_id}`);
    if (legsCam !== item.camera_id) {
      legs = (await api(`/api/projects/${pid}/cameras/${item.camera_id}/calibration`)).legs || [];
      legsCam = item.camera_id;
    }
    const o = legById(item.claimed_origin_leg_id), d = legById(item.claimed_dest_leg_id);
    $('where').textContent = `Item ${idx + 1} of ${items.length} · camera ${item.camera_id} · ${item.window}`;
    $('claim').textContent = `${legName(o)} → ${legName(d)} (${item.claimed_movement || '?'})`;
    $('detail').textContent = item.claim_detail;
    fillLegs($('trueO'), item.claimed_origin_leg_id); fillLegs($('trueD'), item.claimed_dest_leg_id);
    $('wrongBox').hidden = true; $('note').value = item.answer ? item.answer.note : '';
    document.querySelectorAll('.verdicts button').forEach(b =>
      b.setAttribute('aria-pressed', String(!!item.answer && item.answer.verdict === b.dataset.v)));
    $('scrub').max = (t1() - t0()).toFixed(1);
    if (curVideo !== item.video_id) {
      curVideo = item.video_id;
      vid.src = `/api/projects/${pid}/videos/${item.video_id}/stream`;
      vid.addEventListener('loadedmetadata', () => { layout(); start(); }, { once: true });
    } else { start(); }
  }
  function start() { vid.currentTime = t0(); vid.playbackRate = Number($('speed').value); vid.play().catch(() => {}); }

  async function answer(verdict) {
    if (!item) return;
    const body = { verdict, note: $('note').value };
    if (verdict === 'wrong_movement') {
      body.true_origin_leg_id = Number($('trueO').value); body.true_dest_leg_id = Number($('trueD').value);
    }
    try {
      const a = await api(`/api/projects/${pid}/audit-items/${item.item_id}/answer`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      items[idx].answer = a; renderProgress(); toast('Saved');
      nextTodo();
    } catch (e) { toast('Not saved: ' + e.message, true); }
  }
  function pick(verdict) {
    if (verdict === 'wrong_movement') { $('wrongBox').hidden = false; $('trueO').focus(); return; }
    answer(verdict);
  }
  function nextTodo() {
    for (let k = 1; k <= items.length; k++) {
      const j = (idx + k) % items.length;
      if (!items[j].answer) { load(j); return; }
    }
    toast('All items answered — thank you');
  }

  document.querySelectorAll('.verdicts button').forEach(b => b.addEventListener('click', () => pick(b.dataset.v)));
  $('saveWrong').addEventListener('click', () => answer('wrong_movement'));
  $('prevBtn').addEventListener('click', () => load(idx - 1));
  $('nextBtn').addEventListener('click', () => load(idx + 1));
  $('todoBtn').addEventListener('click', nextTodo);
  $('playBtn').addEventListener('click', () => vid.paused ? vid.play().catch(() => {}) : vid.pause());
  $('replayBtn').addEventListener('click', start);
  $('speed').addEventListener('change', e => vid.playbackRate = Number(e.target.value));
  $('scrub').addEventListener('input', e => vid.currentTime = t0() + Number(e.target.value));
  document.addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT') { if (ev.key === 'Enter' && !$('wrongBox').hidden) answer('wrong_movement'); return; }
    if (ev.target.tagName === 'SELECT' && ev.key !== 'Enter') return;
    const k = ev.key.toLowerCase();
    if (k === ' ') { ev.preventDefault(); vid.paused ? vid.play().catch(() => {}) : vid.pause(); }
    else if (k === 'r') start();
    else if (k === 'arrowleft') { ev.preventDefault(); vid.currentTime = Math.max(t0(), vid.currentTime - 1); }
    else if (k === 'arrowright') { ev.preventDefault(); vid.currentTime = Math.min(t1(), vid.currentTime + 1); }
    else if (k === '[') load(idx - 1);
    else if (k === ']') load(idx + 1);
    else if (k === 'enter' && !$('wrongBox').hidden) { ev.preventDefault(); answer('wrong_movement'); }
    else if (['1', '2', '3', '4', '5'].includes(k)) {
      pick(['correct', 'wrong_movement', 'not_intersection', 'double', 'unsure'][Number(k) - 1]);
    }
  });

  async function init() {
    if (!pid) {
      const ps = await api('/api/projects');
      const list = Array.isArray(ps) ? ps : (ps.projects || []);
      for (const p of list) {
        const r = await api(`/api/projects/${p.project_id}/audit-items?batch=${encodeURIComponent(batch)}`).catch(() => ({ items: [] }));
        if (r.items.length) { pid = p.project_id; break; }
      }
    }
    if (!pid) { $('claim').textContent = 'No audit items yet.'; return; }
    items = (await api(`/api/projects/${pid}/audit-items?batch=${encodeURIComponent(batch)}`)).items;
    renderProgress();
    const first = items.findIndex(i => !i.answer);
    await load(first < 0 ? 0 : first);
    requestAnimationFrame(tick);
  }
  init().catch(e => { $('claim').textContent = 'Could not load: ' + e.message; });
})();
</script>
</body>
</html>
